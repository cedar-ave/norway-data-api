openapi: 3.1.0
info:
  title: Norway Data API
  version: 1.1.5
  contact:
    name: Report an issue
    url: https://github.com/cedar-ave/norway-data-api/issues
  license:
    name: MIT
    identifier: MIT
  # Every fenced json block below that follows a curl block is the exact
  # response to that request. scripts/contract-test.mjs checks this, so
  # update the example whenever the data or the API changes.
  description: |
    This is a REST API I built as a sample for my portfolio site. The code samples work. The API returns short facts about Norway and the places they're about. The code, spec, and tests are on [GitHub](https://github.com/cedar-ave/norway-data-api).

    ## Quick start

    No account or key is needed. Get fact 10:

    ```bash
    curl https://api.marlasowards.com/norway-data/v1/facts/10
    ```

    ```json
    {
      "id": 10,
      "category": "history",
      "title": "First to the South Pole",
      "text": "Roald Amundsen's expedition was the first to reach the South Pole, on 14 December 1911.",
      "placeIds": []
    }
    ```

    Next, try `GET /random-fact` for a different fact each time, or start
    at `GET /`, which links to every collection.

    For a step-by-step walkthrough in JavaScript or Python, see the
    tutorial [Show a random fact with its places](https://www.marlasowards.com/samples/norway-data-api-guides/show-a-random-fact).
    More guides cover getting every item in a collection, handling errors
    and retries, caching, and calling the API from a browser.

    ## Authentication

    None. Send requests without credentials.

    ## Data model

    The API has three resources:

    - **Facts:** one or two sentences about Norway. Each fact belongs to one
      category and lists the places it's about in `placeIds` (which can be
      empty).
    - **Categories:** the topics facts are grouped into.
    - **Places:** locations in Norway that facts are about, such as a fjord,
      mountain, or city.

    A list of resources is called a **collection**, such as `/facts` or
    `/places`.

    IDs never change and are never reused:

    - Fact IDs are positive integers, assigned in order.
    - Category and place IDs are lowercase ASCII slugs of the name. For
      example, the ID for Galdhøpiggen is `galdhopiggen`.

    New facts, categories, and places can be added at any time. To get the
    current count of anything, read `pagination.total` from its collection.

    To get the facts about a place, filter by its ID:

    ```bash
    curl "https://api.marlasowards.com/norway-data/v1/facts?place=svalbard"
    ```

    ```json
    {
      "data": [
        {
          "id": 7,
          "category": "geography",
          "title": "An Arctic archipelago",
          "text": "Svalbard, roughly halfway between mainland Norway and the North Pole, is part of Norway. Its largest settlement is Longyearbyen.",
          "placeIds": [
            "svalbard",
            "longyearbyen"
          ]
        },
        {
          "id": 20,
          "category": "nature",
          "title": "Polar bears",
          "text": "Polar bears live on Svalbard, where people leaving the settlements are required to carry protection against them.",
          "placeIds": [
            "svalbard"
          ]
        }
      ],
      "pagination": {
        "total": 2,
        "limit": 10,
        "offset": 0,
        "links": {
          "first": "https://api.marlasowards.com/norway-data/v1/facts?place=svalbard&limit=10&offset=0",
          "prev": null,
          "next": null,
          "last": "https://api.marlasowards.com/norway-data/v1/facts?place=svalbard&limit=10&offset=0"
        }
      }
    }
    ```

    ## Request rules

    - **Base URL:** `https://api.marlasowards.com/norway-data/v1`. A
      trailing slash on any path is optional.
    - **Methods:** every endpoint accepts `GET`, `HEAD`, and `OPTIONS`.
      `HEAD` returns the same status and headers as `GET`, with no body.
      `OPTIONS` answers browser CORS preflight requests. Any other method
      returns an error with status `405`.
    - **Query parameters:** each endpoint accepts only the parameters listed
      for it. An unknown parameter (such as a misspelled `limt`), a
      parameter given more than once, or a value that isn't allowed returns
      an error with status `400`. Two kinds of parameters are ignored
      instead, so shared links and some HTTP clients keep working: campaign
      tracking parameters that start with `utm_`, and `_`, which some
      clients add to bypass caches.
    - **Path parameters:** each resource has exactly one URL. For example,
      `/facts/010` returns `400`; use `/facts/10`.
    - **Unknown paths:** a path that matches no endpoint returns `404`. A
      path with invalid percent-encoding, such as `/facts/%E0`, returns
      `400`.
    - **`Accept` header:** every response is JSON, whatever the `Accept`
      header asks for. The API doesn't return `406 Not Acceptable`.
    - **Cross-origin requests (CORS):** any website can call the API from a
      browser. Responses include `Access-Control-Allow-Origin: *`, and
      scripts can read the `ETag`, `Link`, and `Retry-After` headers.

    ## Response format

    Responses are JSON, encoded as UTF-8. Field names use camelCase.
    Responses are indented so they're readable in a terminal.

    - A **collection** returns an object with a `data` array and a
      `pagination` object. See [Pagination](#description/pagination).
    - A **single resource**, such as one fact or one place, returns the
      resource object itself.
    - An **error** returns a problem details object. See
      [Errors](#description/errors).

    New fields can be added to any object, so ignore fields you don't
    recognize. Category IDs and place types can also gain new values.

    ## Pagination

    Every collection is paginated the same way, even short ones. Two query
    parameters control the page:

    | Parameter | Values | Default |
    | --- | --- | --- |
    | `limit` | 1-50 | 10 |
    | `offset` | 0-10000 | 0 |

    Each page includes links to the first, previous, next, and last pages.
    The links keep the request's filters:

    ```bash
    curl "https://api.marlasowards.com/norway-data/v1/facts?category=history&limit=2&offset=2"
    ```

    ```json
    {
      "data": [
        {
          "id": 10,
          "category": "history",
          "title": "First to the South Pole",
          "text": "Roald Amundsen's expedition was the first to reach the South Pole, on 14 December 1911.",
          "placeIds": []
        },
        {
          "id": 11,
          "category": "history",
          "title": "Two votes against the EU",
          "text": "Norwegian voters rejected membership in the European Community in 1972 and in the European Union in 1994.",
          "placeIds": []
        }
      ],
      "pagination": {
        "total": 7,
        "limit": 2,
        "offset": 2,
        "links": {
          "first": "https://api.marlasowards.com/norway-data/v1/facts?category=history&limit=2&offset=0",
          "prev": "https://api.marlasowards.com/norway-data/v1/facts?category=history&limit=2&offset=0",
          "next": "https://api.marlasowards.com/norway-data/v1/facts?category=history&limit=2&offset=4",
          "last": "https://api.marlasowards.com/norway-data/v1/facts?category=history&limit=2&offset=6"
        }
      }
    }
    ```

    To get every item, follow `pagination.links.next` until it's `null`.
    The same links are also in the `Link` response header, in the
    [RFC 8288](https://www.rfc-editor.org/rfc/rfc8288) format. An `offset`
    past the end returns an empty `data` array.

    ## Caching

    Responses can be cached, except for `/random-fact`:

    - Each `200` response includes an `ETag` header and
      `Cache-Control: public, max-age=3600`, so clients can reuse it for an
      hour.
    - To check whether a cached response is still current, send its `ETag`
      value in an `If-None-Match` header. If nothing changed, the API
      returns `304 Not Modified` with no body. Browsers do this
      automatically.
    - `ETag` values are weak (they start with `W/`), because the same
      response can be sent with different compression.
    - `/random-fact` responses include `Cache-Control: no-store`, so every
      request gets a new random fact.
    - Error responses include `Cache-Control: no-store`.

    Responses also include a `Netlify-CDN-Cache-Control` header. It
    controls caching on the Netlify CDN that serves the API, and clients can
    ignore it.

    ## Rate limits

    Each IP address can send 60 requests per 60 seconds. The window slides:
    the limit counts the requests in the last 60 seconds at any moment, not
    in fixed one-minute blocks.

    A request over the limit gets an error with status
    `429 Too Many Requests` and a `Retry-After` header with the number of
    seconds to wait before retrying. See [Errors](#description/errors).

    A client that keeps sending requests after a `429` can also get `429`
    responses with an empty body and no `Retry-After` header. Treat any
    `429` the same way: wait 60 seconds, then retry.

    Responses don't include headers that count your remaining requests,
    such as `X-RateLimit-Remaining`. To stay under the limit:

    - Reuse responses for the `max-age` in their `Cache-Control` header
      instead of requesting them again. See [Caching](#description/caching).
    - Request up to 50 items per page with `limit=50`, instead of many
      small pages.
    - To show several random facts, get `/facts?limit=50` once and choose
      from it, instead of calling `/random-fact` in a loop.

    ## Errors

    Errors use the problem details format from
    [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457), with the
    `application/problem+json` media type. This request has two invalid
    query parameters:

    ```bash
    curl "https://api.marlasowards.com/norway-data/v1/facts?limit=0&limt=5"
    ```

    ```json
    {
      "type": "tag:marlasowards.com,2026:norway-data/invalid-parameter",
      "title": "Invalid parameter",
      "status": 400,
      "detail": "2 query parameters are invalid. See errors for details.",
      "instance": "/norway-data/v1/facts?limit=0&limt=5",
      "requestId": "01JEXAMPLE0REQUEST0ID00000",
      "errors": [
        {
          "parameter": "limt",
          "detail": "Unknown parameter. Allowed: category, place, limit, offset."
        },
        {
          "parameter": "limit",
          "detail": "Must be an integer from 1 to 50."
        }
      ]
    }
    ```

    | Field | Description |
    | --- | --- |
    | `type` | Identifies the kind of error. Use this field in code to decide how to handle an error. It never changes for a given kind of error. |
    | `title` | A short name for the kind of error. |
    | `status` | The HTTP status code. |
    | `detail` | An explanation of this specific error, for people to read. The wording can change, so don't use it in code. |
    | `instance` | The request path and query string that caused the error. |
    | `requestId` | A unique ID for the request. Include it when you [report an issue](https://github.com/cedar-ave/norway-data-api/issues). |
    | `errors` | Only on `400` errors. Lists every invalid parameter, not just the first. |

    The API returns these kinds of errors:

    | Status | `type` | What to do |
    | --- | --- | --- |
    | `400` | `tag:marlasowards.com,2026:norway-data/invalid-parameter` | Fix the parameters listed in `errors`, then retry. |
    | `400` | `tag:marlasowards.com,2026:norway-data/invalid-path` | Fix the path's percent-encoding. |
    | `404` | `tag:marlasowards.com,2026:norway-data/not-found` | Check the ID or path. Don't retry. |
    | `405` | `tag:marlasowards.com,2026:norway-data/method-not-allowed` | Use `GET`. The `Allow` header lists the supported methods. |
    | `429` | `tag:marlasowards.com,2026:norway-data/rate-limited` | Wait the number of seconds in the `Retry-After` header, then retry. |
    | `500` | `tag:marlasowards.com,2026:norway-data/internal-error` | Retry later. If it keeps happening, report it with the `requestId`. |

    The `type` values are identifiers, not web addresses. They don't open a
    page.

    ## Versioning

    The major version is part of the base URL (`/v1`). Within `v1`, changes
    are additive only: new endpoints, new optional query parameters, new
    fields, and new values for category IDs and place types. A change that
    could break an existing client would ship as `v2` at a new base URL,
    with notice in the changelog.

    `https://api.marlasowards.com/norway-data`, without a version,
    redirects to the current major version.

    Before version 1.1.0, the base URL was
    `https://www.marlasowards.com/api/norway-data/v1`. Requests to it are
    permanently redirected (`301`) to the same path on the current base
    URL. Most HTTP clients follow redirects automatically. With `curl`, add
    `-L`.

    ## Changelog

    | Version | Date | Changes |
    | --- | --- | --- |
    | 1.1.5 | 12 October 2026 | Reference page only: links to a new tutorial and how-to guides. |
    | 1.1.4 | 12 October 2026 | A rate-limited request's `429` response now has the requested path in `instance`, instead of an internal path. |
    | 1.1.3 | 12 October 2026 | Reference page only: clearer endpoint and parameter descriptions, advice on staying under the rate limit, and examples that match what **Test Request** returns. |
    | 1.1.2 | 11 October 2026 | Reference page only: parameter examples now work together, so **Test Request** on **List facts** returns results. |
    | 1.1.1 | 11 October 2026 | Security fixes. Links in responses always use `https`, whatever the request's `X-Forwarded-Proto` header says. Responses include security headers (`Content-Security-Policy`, `Referrer-Policy`, `Cross-Origin-Resource-Policy`, and HSTS with `includeSubDomains`). Error messages shorten long values echoed from the request. |
    | 1.1.0 | 11 October 2026 | New base URL, `https://api.marlasowards.com/norway-data/v1`. The old base URL redirects to it. Rate-limited requests now get a problem details `429` with a `Retry-After` header. `utm_*` and `_` query parameters are ignored instead of rejected. A path with invalid percent-encoding returns `400` instead of `404`. `ETag` values are now weak. |
    | 1.0.1 | 11 October 2026 | Pagination and index links now always use the URL the client called. Added facts about the Kon-Tiki expedition and the Kon-Tiki Museet place. |
    | 1.0.0 | 11 October 2026 | First release. |

    ## About the data

    - The facts are short, general-knowledge summaries written for this API.
      They aren't individually sourced, and numbers are rounded, so check a
      primary source before you cite one.
    - The API isn't affiliated with the Norwegian government, Statistics
      Norway, or any other official source of Norwegian data.
    - All text is in English. Place names use their Norwegian spelling.
    - The data is available under the same MIT license as the API's code.
    - To report an error in a fact or a bug in the API, open an issue in
      the [API's GitHub repository](https://github.com/cedar-ave/norway-data-api/issues).
externalDocs:
  description: Tutorial and how-to guides
  url: https://www.marlasowards.com/samples/norway-data-api-guides/show-a-random-fact
servers:
  - url: https://api.marlasowards.com/norway-data/v1
    description: Production
# Public API: no authentication.
security: []
tags:
  - name: Index
    description: The starting point, with links to each collection.
  - name: Facts
    description: Short facts about Norway. Filter by category or place.
  - name: Categories
    description: The topics that facts are grouped into.
  - name: Places
    description: Locations in Norway that facts are about.
paths:
  /:
    get:
      tags: [Index]
      operationId: getIndex
      summary: Get the API index
      description: The starting point for the API. Returns its name and major version, plus links to each collection, this reference page, and the OpenAPI document, so you can explore the API from one URL.
      responses:
        '200':
          description: The API index.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiIndex'
              x-example-request: /
              example:
                name: Norway Data API
                version: v1
                documentation: https://www.marlasowards.com/api-reference
                openapi: https://api.marlasowards.com/openapi/norway-data.yaml
                links:
                  facts: https://api.marlasowards.com/norway-data/v1/facts
                  randomFact: https://api.marlasowards.com/norway-data/v1/random-fact
                  categories: https://api.marlasowards.com/norway-data/v1/categories
                  places: https://api.marlasowards.com/norway-data/v1/places
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /facts:
    get:
      tags: [Facts]
      operationId: listFacts
      summary: List facts
      description: Returns a page of facts, in ID order. Filter by `category`, `place`, or both. With both, a fact must match both filters. If no facts match, `data` is an empty array, not an error.
      parameters:
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Place'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of facts.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Fact'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              x-example-request: /facts?category=culture&place=oslo&limit=2&offset=0
              example:
                data:
                  - id: 15
                    category: culture
                    title: The Scream
                    text: Edvard Munch, who painted The Scream, was Norwegian. The National Museum and the Munch museum in Oslo both hold versions of it.
                    placeIds: [oslo]
                  - id: 30
                    category: culture
                    title: The raft in Oslo
                    text: The original Kon-Tiki raft is on display at the Kon-Tiki Museet on the Bygdøy peninsula in Oslo.
                    placeIds: [kon-tiki-museet, oslo]
                pagination:
                  total: 2
                  limit: 2
                  offset: 0
                  links:
                    first: https://api.marlasowards.com/norway-data/v1/facts?category=culture&place=oslo&limit=2&offset=0
                    prev: null
                    next: null
                    last: https://api.marlasowards.com/norway-data/v1/facts?category=culture&place=oslo&limit=2&offset=0
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /facts/{id}:
    get:
      tags: [Facts]
      operationId: getFact
      summary: Get a fact
      description: Returns one fact by its ID. Use it to show a specific fact, such as one you saved earlier. For a different fact each time, use `/random-fact`.
      parameters:
        - name: id
          in: path
          required: true
          description: The fact's ID. Write it without leading zeros.
          schema:
            type: integer
            minimum: 1
          example: 3
      responses:
        '200':
          description: The fact.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
              x-example-request: /facts/3
              example:
                id: 3
                category: geography
                title: Highest peak in Northern Europe
                text: Galdhøpiggen in Jotunheimen is 2,469 m tall, making it the highest mountain in Norway and in Northern Europe.
                placeIds: [galdhopiggen, jotunheimen]
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /random-fact:
    get:
      tags: [Facts]
      operationId: getRandomFact
      summary: Get a random fact
      description: Returns one fact chosen at random, such as for a fact of the day. To choose from one category, add `category`. Responses are never cached, so each request can return a different fact.
      parameters:
        - $ref: '#/components/parameters/Category'
      responses:
        '200':
          description: A random fact. Yours will likely differ from this example.
          headers:
            Cache-Control:
              description: Always `no-store`. See [Caching](#description/caching).
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
              example:
                id: 14
                category: culture
                title: Sámi languages
                text: Sámi languages have official status in Norway, and the Sámi Parliament (Sámediggi) meets in Karasjok.
                placeIds: [karasjok]
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List categories
      description: Returns the categories that facts are grouped into, in a fixed order. Use a category's `id` as the `category` filter on `/facts` and `/random-fact`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of categories.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              x-example-request: /categories?limit=2
              example:
                data:
                  - id: geography
                    name: Geography
                    description: Mountains, fjords, glaciers, lakes, and borders.
                  - id: history
                    name: History
                    description: Independence, the constitution, exploration, and politics.
                pagination:
                  total: 5
                  limit: 2
                  offset: 0
                  links:
                    first: https://api.marlasowards.com/norway-data/v1/categories?limit=2&offset=0
                    prev: null
                    next: https://api.marlasowards.com/norway-data/v1/categories?limit=2&offset=2
                    last: https://api.marlasowards.com/norway-data/v1/categories?limit=2&offset=4
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /places:
    get:
      tags: [Places]
      operationId: listPlaces
      summary: List places
      description: Returns the places that facts are about, in ID order. Use a place's `id` as the `place` filter on `/facts`, or to look up the places in a fact's `placeIds`.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of places.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Place'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              x-example-request: /places?limit=2
              example:
                data:
                  - id: dovrefjell
                    name: Dovrefjell
                    type: mountain-area
                    description: Mountain range in central Norway, home to a herd of muskoxen.
                  - id: eidsvoll
                    name: Eidsvoll
                    type: municipality
                    description: Municipality north of Oslo where the constitution was signed in 1814.
                pagination:
                  total: 15
                  limit: 2
                  offset: 0
                  links:
                    first: https://api.marlasowards.com/norway-data/v1/places?limit=2&offset=0
                    prev: null
                    next: https://api.marlasowards.com/norway-data/v1/places?limit=2&offset=2
                    last: https://api.marlasowards.com/norway-data/v1/places?limit=2&offset=14
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /places/{id}:
    get:
      tags: [Places]
      operationId: getPlace
      summary: Get a place
      description: Returns one place by its ID. Use it to show the name and description of a place in a fact's `placeIds`. To get the facts about a place, call `/facts?place={id}`.
      parameters:
        - name: id
          in: path
          required: true
          description: The place's ID.
          schema:
            $ref: '#/components/schemas/PlaceId'
          example: sognefjord
      responses:
        '200':
          description: The place.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
              x-example-request: /places/sognefjord
              example:
                id: sognefjord
                name: Sognefjord
                type: fjord
                description: Fjord in Vestland and the longest and deepest in Norway.
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    Category:
      name: category
      in: query
      description: Only return facts in this category. To get each category's name and description, call `/categories`.
      schema:
        type: string
        enum: [geography, history, culture, nature, economy]
      example: culture
    Place:
      name: place
      in: query
      description: Only return facts about this place. Get place IDs from `/places`. An ID that isn't a place returns an error with status `400`, not an empty list.
      schema:
        $ref: '#/components/schemas/PlaceId'
      example: oslo
    Limit:
      name: limit
      in: query
      description: The maximum number of items to return. See [Pagination](#description/pagination).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
      example: 2
    Offset:
      name: offset
      in: query
      description: The number of items to skip. See [Pagination](#description/pagination).
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
      example: 0
  headers:
    ETag:
      description: An identifier for this version of the response. See [Caching](#description/caching).
      schema:
        type: string
        examples: ['W/"q1tC4kL0ZHr7n3U2pYbW8xM9aQe"']
    CacheControl:
      description: See [Caching](#description/caching).
      schema:
        type: string
        const: public, max-age=3600
    Link:
      description: The same page links as `pagination.links`. See [Pagination](#description/pagination).
      schema:
        type: string
        examples: ['<https://api.marlasowards.com/norway-data/v1/categories?limit=2&offset=0>; rel="first", <https://api.marlasowards.com/norway-data/v1/categories?limit=2&offset=2>; rel="next", <https://api.marlasowards.com/norway-data/v1/categories?limit=2&offset=4>; rel="last"']
  schemas:
    CategoryId:
      type: string
      description: 'A category ID. Current values: `geography`, `history`, `culture`, `nature`, `economy`. More can be added, so handle values you don''t recognize.'
      examples: [history]
    PlaceId:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: A place ID, a lowercase ASCII slug of the place's name.
      examples: [sognefjord]
    Fact:
      type: object
      additionalProperties: false
      required: [id, category, title, text, placeIds]
      properties:
        id:
          type: integer
          minimum: 1
          description: The fact's ID.
          examples: [10]
        category:
          $ref: '#/components/schemas/CategoryId'
        title:
          type: string
          description: A short headline for the fact.
          examples: [First to the South Pole]
        text:
          type: string
          description: The fact, in one or two sentences.
          examples: ["Roald Amundsen's expedition was the first to reach the South Pole, on 14 December 1911."]
        placeIds:
          type: array
          description: IDs of the places the fact is about, if any. Get details from `/places/{id}`.
          items:
            $ref: '#/components/schemas/PlaceId'
          examples: [[galdhopiggen, jotunheimen]]
    Category:
      type: object
      additionalProperties: false
      required: [id, name, description]
      properties:
        id:
          $ref: '#/components/schemas/CategoryId'
        name:
          type: string
          description: The category's display name.
          examples: [History]
        description:
          type: string
          description: What the category covers.
          examples: [Independence, the constitution, exploration, and politics.]
    Place:
      type: object
      additionalProperties: false
      required: [id, name, type, description]
      properties:
        id:
          $ref: '#/components/schemas/PlaceId'
        name:
          type: string
          description: The place's name, in Norwegian spelling.
          examples: [Galdhøpiggen]
        type:
          type: string
          description: 'The kind of place. Current values: `archipelago`, `cape`, `city`, `fjord`, `glacier`, `lake`, `mountain`, `mountain-area`, `municipality`, `museum`, `oil-field`, `plateau`, `settlement`. More can be added, so handle values you don''t recognize.'
          examples: [mountain]
        description:
          type: string
          description: One sentence about the place.
          examples: [Mountain in Jotunheimen and the highest peak in Norway.]
    Pagination:
      type: object
      additionalProperties: false
      required: [total, limit, offset, links]
      description: See [Pagination](#description/pagination).
      properties:
        total:
          type: integer
          minimum: 0
          description: The number of items that match the request, across all pages.
          examples: [2]
        limit:
          type: integer
          description: The `limit` used for this page.
          examples: [10]
        offset:
          type: integer
          description: The `offset` used for this page.
          examples: [0]
        links:
          type: object
          additionalProperties: false
          required: [first, prev, next, last]
          description: URLs of other pages. `prev` is `null` on the first page, and `next` is `null` on the last page.
          properties:
            first:
              type: string
              format: uri
              description: The first page.
            prev:
              type: [string, 'null']
              format: uri
              description: The previous page, or `null` on the first page.
            next:
              type: [string, 'null']
              format: uri
              description: The next page, or `null` on the last page. To get every item, follow `next` until it's `null`.
            last:
              type: string
              format: uri
              description: The last page.
    ApiIndex:
      type: object
      additionalProperties: false
      required: [name, version, documentation, openapi, links]
      properties:
        name:
          type: string
          description: The API's name.
          examples: [Norway Data API]
        version:
          type: string
          description: The API's major version.
          examples: [v1]
        documentation:
          type: string
          format: uri
          description: The URL of this reference page.
        openapi:
          type: string
          format: uri
          description: The URL of the API's OpenAPI document.
        links:
          type: object
          additionalProperties: false
          required: [facts, randomFact, categories, places]
          description: The URL of each collection, plus `/random-fact`.
          properties:
            facts:
              type: string
              format: uri
            randomFact:
              type: string
              format: uri
            categories:
              type: string
              format: uri
            places:
              type: string
              format: uri
    Problem:
      type: object
      description: An error, in the RFC 9457 problem details format. See [Errors](#description/errors).
      additionalProperties: false
      required: [type, title, status, detail, instance, requestId]
      properties:
        type:
          type: string
          format: uri
          description: Identifies the kind of error. Use this field in code.
          examples: ['tag:marlasowards.com,2026:norway-data/not-found']
        title:
          type: string
          description: A short name for the kind of error.
          examples: [Not found]
        status:
          type: integer
          description: The HTTP status code.
          examples: [404]
        detail:
          type: string
          description: An explanation for people to read. Don't use it in code.
          examples: [No fact has the ID 99.]
        instance:
          type: string
          description: The request path and query string that caused the error.
          examples: [/norway-data/v1/facts/99]
        requestId:
          type: string
          description: A unique ID for the request.
          examples: [01JEXAMPLE0REQUEST0ID00000]
        errors:
          type: array
          description: Only on `400` errors. Every invalid parameter.
          items:
            $ref: '#/components/schemas/ParameterError'
    ParameterError:
      type: object
      additionalProperties: false
      required: [parameter, detail]
      properties:
        parameter:
          type: string
          description: The parameter's name.
          examples: [limit]
        detail:
          type: string
          description: What's wrong with its value.
          examples: [Must be an integer from 1 to 50.]
  responses:
    NotModified:
      description: The response matching your `If-None-Match` value is still current. There's no body. See [Caching](#description/caching).
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
    BadRequest:
      description: A parameter is unknown, repeated, or has a value that isn't allowed, or the path has invalid percent-encoding. See [Errors](#description/errors).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          x-example-request: /facts?category=food
          example:
            type: tag:marlasowards.com,2026:norway-data/invalid-parameter
            title: Invalid parameter
            status: 400
            detail: A query parameter is invalid. See errors for details.
            instance: /norway-data/v1/facts?category=food
            requestId: 01JEXAMPLE0REQUEST0ID00000
            errors:
              - parameter: category
                detail: 'Must be one of: geography, history, culture, nature, economy.'
    NotFound:
      description: No resource has that ID. See [Errors](#description/errors).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          x-example-request: /facts/99
          example:
            type: tag:marlasowards.com,2026:norway-data/not-found
            title: Not found
            status: 404
            detail: No fact has the ID 99.
            instance: /norway-data/v1/facts/99
            requestId: 01JEXAMPLE0REQUEST0ID00000
    TooManyRequests:
      description: Too many requests from your IP address. See [Rate limits](#description/rate-limits).
      headers:
        Retry-After:
          description: The number of seconds to wait before retrying.
          schema:
            type: string
            pattern: '^\d+$'
            examples: ['60']
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: tag:marlasowards.com,2026:norway-data/rate-limited
            title: Too many requests
            status: 429
            detail: Too many requests from your IP address. Wait 60 seconds, then retry.
            instance: /norway-data/v1/random-fact
            requestId: 01JEXAMPLE0REQUEST0ID00000
    InternalError:
      description: The server hit an unexpected error. See [Errors](#description/errors).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: tag:marlasowards.com,2026:norway-data/internal-error
            title: Internal error
            status: 500
            detail: The server hit an unexpected error. Try again later.
            instance: /norway-data/v1/facts
            requestId: 01JEXAMPLE0REQUEST0ID00000
