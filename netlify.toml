# Netlify publishes public/ (the OpenAPI spec) and bundles the functions in
# netlify/functions/. The build command runs the spec lint and the contract
# test, so a push that fails them never deploys.

[build]
  publish = "public"
  command = "npm run lint && npm test"

# Dependencies install from package-lock.json (exact versions and integrity
# hashes) with install scripts turned off, so no package can run code just
# by being installed. Nothing here needs install scripts.
[build.environment]
  NPM_FLAGS = "--ignore-scripts"

[functions]
  directory = "netlify/functions"

# The API's production domain is api.marlasowards.com, so requests to this
# site's netlify.app address redirect there. Deploy previews have their own
# addresses and aren't affected. force = true applies the rule even where a
# function or file would answer.
[[redirects]]
  from = "https://norway-data-api.netlify.app/*"
  to = "https://api.marlasowards.com/:splat"
  status = 301
  force = true

# Visitors to the site's root get sent to the reference page.
[[redirects]]
  from = "/"
  to = "https://www.marlasowards.com/api-reference"
  status = 302

# The reference page on www.marlasowards.com loads the spec from here, so
# any origin may read it. The other headers match the ones the functions set
# in code (these rules only apply to static files, not function responses).
[[headers]]
  for = "/openapi/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Resource-Policy = "cross-origin"
