# Netlify publishes public/ (the OpenAPI spec) and bundles the functions in
# netlify/functions/. The build command runs the spec lint and the contract
# test, so a push that fails them never deploys.

[build]
  publish = "public"
  command = "npm run lint && npm test"

[functions]
  directory = "netlify/functions"

# The API's production domain is api.marlasowards.com. Visitors to the
# site's root get sent to the reference page.
[[redirects]]
  from = "/"
  to = "https://www.marlasowards.com/api-reference"
  status = 302

# The reference page on www.marlasowards.com loads the spec from here.
[[headers]]
  for = "/openapi/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
