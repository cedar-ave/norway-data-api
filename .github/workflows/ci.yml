# Checks every push and pull request:
# - lints the OpenAPI spec
# - runs the contract test, which checks the function's responses against
#   the spec
# - bundles the functions the way Netlify does, so a config error fails
#   here instead of in a deploy
# - checks that any change to the API comes with a new version and
#   changelog entry
# Netlify also runs the lint and contract test as its build command, so a
# failing push never deploys (see netlify.toml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Lint, contract test, bundle, version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:version compares against earlier commits.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint the OpenAPI spec
        run: npm run lint

      - name: Run the contract test
        run: npm test

      - name: Bundle the functions like Netlify does
        run: npm run check:bundle

      - name: Check the version and changelog
        run: npm run check:version -- "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
